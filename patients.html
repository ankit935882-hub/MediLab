<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>🧪 MediLab</h2>
    <a href="index.html">Dashboard</a>
    <a href="patients.html" class="active">Patients</a>
    <a href="samples.html">Samples</a>
    <a href="tests.html">Test Selection</a>
    <a href="results.html">Results</a>
    <a href="reports.html">Reports</a>
</div>

<div class="main">
    <header><h1>Patient Registration</h1></header>

    <div class="panel">
        <h2>Register New Patient</h2>

        <form id="patientForm">

            <label>Patient Name</label>
            <input type="text" id="patientName" required>

            <label>Age</label>
            <input type="number" id="patientAge" min="1" max="120" required>

            <label>Gender</label>
            <select id="patientGender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Phone Number</label>
            <input type="tel" id="patientPhone" pattern="[0-9]{10}" required>

            <label>Address</label>
            <textarea id="patientAddress" required></textarea>

            <button type="submit" class="btn">Register Patient</button>
        </form>
    </div>

    <div class="panel">
        <h2>Registered Patients</h2>

        <input type="text" id="patientSearch" placeholder="Search patient...">

        <table>
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody id="patientTable"></tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
<script src="patients.js"></script>
</body>
</html>
