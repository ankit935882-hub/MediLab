<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>🧪 MediLab</h2>
    <a href="index.html">Dashboard</a>
    <a href="patients.html">Patients</a>
    <a href="samples.html" class="active">Samples</a>
    <a href="tests.html">Test Selection</a>
    <a href="results.html">Results</a>
    <a href="reports.html">Reports</a>
</div>

<div class="main">
    <header><h1>Sample Management</h1></header>

    <div class="panel">
        <h2>Collect New Sample</h2>

        <form id="sampleForm">

            <label>Select Patient</label>
            <select id="samplePatient" required>
                <option value="">Select Patient</option>
            </select>

            <label>Select Test</label>
            <select id="sampleTest" required>
                <option value="">Select Test</option>
                <option>CBC</option>
                <option>Blood Sugar</option>
                <option>Liver Function Test</option>
                <option>Kidney Function Test</option>
                <option>Lipid Profile</option>
                <option>Thyroid Profile</option>
            </select>

            <label>Technician Name</label>
            <select id="technician" required>
                <option value="">Assign Technician</option>
                <option>Rahul Sharma</option>
                <option>Aman Verma</option>
                <option>Priya Singh</option>
                <option>Neha Gupta</option>
            </select>

            <label>Sample Type</label>
            <select id="sampleType" required>
                <option value="">Select Sample Type</option>
                <option>Blood</option>
                <option>Urine</option>
                <option>Serum</option>
            </select>

            <button type="submit" class="btn">Add Sample</button>
        </form>
    </div>

    <div class="panel">
        <h2>Sample Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Sample ID</th>
                    <th>Patient</th>
                    <th>Test</th>
                    <th>Technician</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="sampleTable"></tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
<script src="samples.js"></script>
</body>
</html>
